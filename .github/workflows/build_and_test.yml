name: Build and Test
# Ensures that the image meets all the linting rules
# Also that it builds and runs correctly

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    env:
      IMAGE_NAME: "examsys-reserve:test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test the Docker image
        run: |
          docker build . --file Dockerfile --tag $IMAGE_NAME
          docker run --name examsystest -d -p 6311:6311 $IMAGE_NAME
          docker rm -f examsystest
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        id: hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          ignore: DL3059
